# Restaurant admin dashboard on the shared NawyOrders VPS.
# Dedicated compose project and container. No published host port: Caddy
# reaches the container by name on genmarka_default.
name: restaurant-dashboard

services:
  restaurant-dashboard:
    image: nawyorders/restaurant-dashboard:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nawyorders-restaurant-dashboard
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - caddy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  # Caddy's own compose network. The dashboard only needs the proxy.
  caddy:
    external: true
    name: genmarka_default
