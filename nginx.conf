# Static SPA served by nginx-unprivileged on port 8080.
# Caddy reaches this container by name on genmarka_default; no host port is
# published, so this file only needs to answer plain HTTP on 8080.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers, mirroring the values that previously lived only in
    # vercel.json. `add_header` is repeated in locations that add their own
    # headers, because nginx drops inherited add_header directives there.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.nawyorders.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # index.html and every SPA deep link must revalidate on each request.
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Container health probe used by the compose healthcheck and the deploy script.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Vite emits content-hashed filenames under /assets, so they never change.
    location /assets/ {
        try_files $uri =404;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.nawyorders.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # React Router: unknown paths must return the SPA shell, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
